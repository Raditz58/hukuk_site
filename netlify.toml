[build]
  publish = "."
  command = "node build_store.js"

# Decap CMS Admin yönlendirmesi
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Güvenlik ve Önbellek Başlıkları
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
